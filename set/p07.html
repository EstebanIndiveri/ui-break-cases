<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page p07</title>
    <style>
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f4f1ea;
        color: #1c1917;
      }
main {
        padding: 16px;
      }
      #card {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 252px;
        box-sizing: border-box;
        padding: 16px;
        background: #fff;
        border: 1px solid #d6d3d1;
        border-radius: 12px;
      }
      .body {
        flex: 1 1 auto;
        min-width: 0;
      }
      .kicker {
        margin: 0 0 6px;
        font-size: 12px;
        color: #57534e;
      }
      #long-text {
        margin: 0;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      #action {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 8px 14px;
        border-radius: 8px;
        background: #1d4ed8;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <article id="card">
        <div class="body" id="text-column">
          <p class="kicker">Webhook target</p>
          <p id="long-text">https://api.example.test/evt_9f3c2a</p>
        </div>
        <a id="action" href="#copy">Copy</a>
      </article>
      <p id="action-status" hidden>Copied</p>
    </main>
    <script>
      document.getElementById("action").addEventListener("click", (event) => {
        event.preventDefault();
        document.getElementById("action-status").hidden = false;
      });
    </script>
  </body>
</html>
