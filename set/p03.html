<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glasshouse board</title>
<style>
body{margin:0;background:#fefce8;color:#365314;font-family:Garamond,Baskerville,"Times New Roman",serif}
.board{margin:20px;padding:16px 18px 22px;background:#ecfccb;border-left:8px solid #65a30d}
.col{display:flex;flex-direction:column;gap:10px}
#rest{order:3;margin:0;font-size:13px;color:#4d7c0f}
blockquote{order:1;margin:0;padding:0;border:0}
#warning{margin:0;font-size:16px;line-height:24px;height:auto;overflow:visible;}
#widen{order:2}

</style>
</head>
<body>
<main class="board">
<div class="col">
<p id="rest">Next watering is 05:10 at bed C. Leave the cloches on until the frost cloth is pulled.</p>

<blockquote>
<p id="warning">Frost advisory: cover the late tomatoes, the citrus tubs, and the grafted pear before 02:00 because the valley floor drops below freezing and the river fog will linger until sunrise</p>
</blockquote>
</div>
</main>

</body>
</html>
