<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fixed-height-label — control</title>
    <style>
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f4f1ea;
        color: #1c1917;
      }
      .banner {
        margin: 0;
        padding: 8px 16px;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: #1e3a5f;
        color: #eff6ff;
      }
      main {
        padding: 16px;
      }
      .card {
        background: #fff;
        border: 1px solid #d6d3d1;
        border-radius: 12px;
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      #label {
        margin: 0;
        font-size: 16px;
        line-height: 24px;
      }
      #label.is-collapsed {
        height: 24px;
        overflow: hidden;
      }
      #expand-toggle {
        margin-top: 10px;
        min-height: 40px;
        padding: 8px 12px;
        border: 1px solid #1d4ed8;
        border-radius: 8px;
        background: #eff6ff;
        color: #1e3a8a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #expand-toggle:focus-visible {
        outline: 3px solid #1d4ed8;
        outline-offset: 2px;
      }
      #next-content {
        margin: 16px 0 0;
        padding-top: 12px;
        border-top: 1px solid #e7e5e4;
        color: #44403c;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <p class="banner">Control · fixed-height-label · 390×640</p>
    <main>
      <section class="card">
        <h1>Shipment status</h1>
        <p id="label" class="is-collapsed">Delayed at the distribution hub because the outbound scan failed validation for carton NW-4418</p>
        <button id="expand-toggle" type="button" aria-expanded="false">
          Show full summary
        </button>
        <p id="next-content">Next checkpoint: customer pickup window 16:00–18:00</p>
      </section>
    </main>
    <script>
      const label = document.getElementById("label");
      const toggle = document.getElementById("expand-toggle");
      toggle.addEventListener("click", () => {
        const expanded = toggle.getAttribute("aria-expanded") === "true";
        const nextExpanded = !expanded;
        toggle.setAttribute("aria-expanded", String(nextExpanded));
        label.classList.toggle("is-collapsed", !nextExpanded);
        toggle.textContent = nextExpanded ? "Show less" : "Show full summary";
      });
    </script>
  </body>
</html>
