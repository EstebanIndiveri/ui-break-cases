<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kitchen ticket</title>
    <style>
      body { margin: 0; background: #fff7ed; color: #7c2d12; font-family: "Trebuchet MS", sans-serif; }
      .sheet { margin: 24px; padding: 18px; background: #ffedd5; border: 4px solid #ea580c; }
      h2 { margin: 0 0 10px; font-size: 15px; }
      #headline { margin: 0; font-size: 16px; line-height: 24px; height:auto;overflow:visible; }
      #follow { margin: 18px 0 0; font-size: 13px; color: #9a3412; }
      
    </style>
  </head>
  <body>
    <div class="sheet">
      <h2>Pass 4 · grill</h2>
      <p id="headline">Allergen note: this plate includes toasted sesame, aged soy, and a reduced brown-butter glaze that must stay on the ticket</p>
      
      <p id="follow">Runner window closes at 19:40. Do not fire dessert until this ticket is bumped.</p>
    </div>
  </body>
</html>
